[project]
name = "tech-nova-attrition"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "shap (>=0.50.0,<0.51.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "pytest (>=8.0.0)",
    "ruff (>=0.3.0)",
    "fastapi (>=0.100.0)",
    "uvicorn (>=0.20.0)",
    "joblib (>=1.3.0)",
    "httpx (>=0.24.0)",
    "jupyterlab (>=4.5.3,<5.0.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"] # Sorting imports

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["F821", "F401", "F704"]
# F821: Undefined name (common in notebook cells)
# F401: Unused import
# F704: Yield/return outside of function
