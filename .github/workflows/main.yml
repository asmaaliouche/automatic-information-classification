name: Machine Learning Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pandas scikit-learn matplotlib seaborn shap nbformat

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with pytest
        run: python -m pytest tests/

  deploy_to_huggingface:
    needs: test_and_lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://asmaaliouche:$HF_TOKEN@huggingface.co/spaces/asmaaliouche/automatic-information-classification
          git push --force hf main
